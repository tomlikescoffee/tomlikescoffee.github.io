<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="main_screen_style.css">
        <title>TomOS</title>
    </head>
    <body>
        <form id="login_container">
            <div id="login_banner">
                <p>Log On to TomOS
            </div>
            <div id="login_logo">
                <p> This is where the logo would be :/</p> 
            </div>
            <div id="login_gradient"></div>
            <div id="login_input_container"> 
                <label for="username">Username:</label>
                <input id="username" class="input_field" name="username" type="text">
                <label for="password">Password:</label>
                <input id="password" class="input_field" name="password" type="text">
                <div id="options">
                    <button type="button">OK</button>
                    <button type="button">Cancel</button>
                    <button type="button">Shutdown...</button>
                </div>
            </div>
        </form>
    </body>
</html>
