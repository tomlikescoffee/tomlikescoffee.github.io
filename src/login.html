<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="login.css">
        <script src="login.js" type="text/javascript" defer></script>
         <link rel="icon" type="image/x-icon" href="../assets/images/stick_figure_favicon.png">
        <title>TomOS</title>
    </head>
    <body class="no_select">
        <div id="login_container">
            <form id="login_form">
                <div id="login_banner">
                    <p>Log On to TomOS</p>
                </div>
                <div id="login_logo">
                    <img src="../assets/images/tomOS_excited_logo.PNG" id="logo_img">
                </div>
                <div id="login_gradient"></div>
                
                <div id="login_input_container"> 
                    <label class="input_label" for="username">Username:</label>
                    <div class="input_field_border">
                        <input id="username" class="input_field" name="username" type="text">
                    </div>
                    <label class="input_label" for="password">Password:</label>
                    <div class="input_field_border">
                        <input id="password" class="input_field" name="password" type="password">
                    </div>
                    <div id="dial_up_container">
                        <input type="checkbox" id="dial_up" name="dial_up" checked>
                        <label for="dial_up">Log on using dial-up connection</label>
                    </div>
                    
                    <div id="options_container">
                        <div class="button button_active_highlight" onmousedown="mark_active_button(event, this)" onmouseup="revert_active_button(event, this)" onmouseleave="revert_active_button(event, this)">
                            <div class="outer_button_border"> 
                                <p class="button_text inner_button_border">OK</p>
                            </div>
                        </div>
                        
                        <div class="button outer_button_border" onmousedown="mark_active_button(event, this)" onmouseup="revert_active_button(event, this)" onmouseleave="revert_active_button(event, this)">
                            <div class="inner_button_border">
                                <p class="button_text">Cancel</p>
                            </div>
                        </div>

                        <div class="button outer_button_border" onmousedown="mark_active_button(event, this)" onmouseup="revert_active_button(event, this)" onmouseleave="revert_active_button(event, this)">
                            <div class="inner_button_border">
                                <p class="button_text">Shutdown...</p>
                            </div> 
                        </div>

                        <div class="button outer_button_border" onmousedown="mark_active_button(event, this)" onmouseup="revert_active_button(event, this)" onmouseleave="revert_active_button(event, this)">
                            <div class="inner_button_border">
                                <p class="button_text">Options <<</p>
                            </div>
                        </div>
                    
                    
                    </div>
                
                
                
            
                </div>
            </form> 
        </div>
    </body>
</html>
